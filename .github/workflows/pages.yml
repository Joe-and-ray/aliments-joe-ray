name: Deploy preview to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      # Pages serves this repo under /<repo-name>/, so build with that base (also adds noindex)
      - run: SITE_BASE="/${{ github.event.repository.name }}" python3 build.py
      - run: mkdir _site && cp -r index.html fr product-catalogue assets sitemap.xml _site/ && touch _site/.nojekyll
      - uses: actions/upload-pages-artifact@v5
      - id: deployment
        uses: actions/deploy-pages@v5
