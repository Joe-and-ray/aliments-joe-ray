name: Deploy preview to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    # agency preview only: does nothing once the site lives in the client's own repository (Cloudflare deploys it there)
    if: github.repository == 'featureJosh/aliments-joe-ray'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      # Pages serves this repo under /<repo-name>/, so build with that base (also adds noindex). build.py writes _site/.
      - run: SITE_BASE="/${{ github.event.repository.name }}" python3 build.py
      - uses: actions/upload-pages-artifact@v5
      - id: deployment
        uses: actions/deploy-pages@v5
